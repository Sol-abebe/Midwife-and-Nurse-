 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Level IV Clinical Exam Simulator</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #1f2937;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --border: #334155;
            --secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--secondary); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-color); }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        select, input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-color);
        }

        .exam-area {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .exam-area { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .question-title {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            text-align: left;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.15);
            font-weight: bold;
        }

        .option-btn.correct {
            border-color: var(--success);
            background: rgba(22, 163, 74, 0.15);
        }

        .option-btn.incorrect {
            border-color: var(--danger);
            background: rgba(220, 38, 38, 0.15);
        }

        .grid-palette {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        .palette-btn {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.85rem;
        }

        .palette-btn.answered { background: var(--primary); color: white; }
        .palette-btn.active { border: 2px solid var(--primary); font-weight: bold; }
        .palette-btn.flagged { border-color: var(--warning); color: var(--warning); }

        .rationale {
            margin-top: 15px;
            padding: 12px;
            border-left: 4px solid var(--primary);
            background: rgba(37, 99, 235, 0.05);
            border-radius: 0 6px 6px 0;
            display: none;
        }

        .timer-box {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--danger);
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Senior Nurse, Midwife and Psychiatry professionals Clinical Exam Simulator</h1>
            <div>
                <button class="btn btn-outline" onclick="toggleTheme()"><strong>Theme</strong></button>
            </div>
        </header>

        <div class="controls">
            <div>
                <label>Professional Track:</label>
                <select id="trackSelect" onchange="loadTrack()">
                    <option value="nurse">Nurse Professional IV (100 Qs)</option>
                    <option value="midwife">Midwife Professional IV (100 Qs)</option>
                    <option value="psychiatry">Psychiatry Professional IV (100 Qs)</option>
                </select>
            </div>
            <div>
                <label>Mode:</label>
                <select id="modeSelect" onchange="resetExam()">
                    <option value="practice">Practice Mode (Instant Feedback)</option>
                    <option value="exam">Exam Mode (Timed Simulation)</option>
                </select>
            </div>
            <div>
                <button class="btn" onclick="startExam()" style="margin-top: 20px; width: 100%;">Start / Restart</button>
            </div>
        </div>

        <div class="exam-area" id="examArea" style="display:none;">
            <div>
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span id="qIndex" style="font-weight:bold; color:var(--secondary);">Question 1 of 100</span>
                        <button class="btn btn-outline" id="flagBtn" onclick="toggleFlag()">Flag Question</button>
                    </div>
                    <div class="question-title" id="qText">Question content goes here...</div>
                    <div class="options" id="optionsBox"></div>
                    <div class="rationale" id="rationaleBox">
                        <strong>Rationale:</strong> <span id="rationaleText"></span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-top:15px;">
                        <button class="btn btn-secondary" onclick="prevQuestion()">Previous</button>
                        <button class="btn" onclick="nextQuestion()">Next</button>
                    </div>
                </div>
            </div>

            <div>
                <div class="card">
                    <div class="timer-box" id="timerBox" style="display:none;">00:00</div>
                    <h3 style="margin-bottom:10px;">Question Palette</h3>
                    <div class="grid-palette" id="gridPalette"></div>
                    <button class="btn btn-secondary" onclick="finishExam()" style="width:100%; margin-top:15px;">Finish & Submit</button>
                </div>
            </div>
        </div>

        <div class="card" id="resultsArea" style="display:none;">
            <h2>Exam Performance Summary</h2>
            <p id="scoreText" style="font-size:1.2rem; margin:15px 0;"></p>
            <button class="btn" onclick="resetExam()" style="margin-top:15px;">Retake Exam</button>
        </div>
    </div>

    <script>
        const questionBank = {
            nurse: [
                {
                    id: "n1",
                    text: "A patient with ARDS on mechanical ventilation exhibits sudden dyspnea, asymmetric chest expansion, and high peak airway pressure alarms. Tracheal deviation to the left is noted. What is the immediate priority intervention?",
                    options: [
                        "Perform emergency needle decompression in the 2nd intercostal space at the midclavicular line",
                        "Increase the Positive End-Expiratory Pressure (PEEP) setting by 5 cmH2O",
                        "Obtain a stat arterial blood gas (ABG) and portable chest X-ray",
                        "Instill 10 mL 0.9% Normal Saline into the endotracheal tube and suction"
                    ],
                    correct: 0,
                    rationale: "The presentation (asymmetric expansion, tracheal deviation, peak pressure alarms) indicates a tension pneumothorax, requiring immediate emergency needle decompression prior to diagnostic chest radiograph."
                },
                {
                    id: "n2",
                    text: "A patient with severe Diabetic Ketoacidosis (DKA) is receiving continuous IV regular insulin infusion at 0.1 units/kg/hr. Serum glucose drops to 230 mg/dL. What is the most appropriate initial adjustment to fluid resuscitation?",
                    options: [
                        "Switch the fluid infusion to 5% Dextrose in 0.45% Normal Saline",
                        "Stop the insulin infusion immediately for 1 hour",
                        "Bolus 50 mL of 50% Dextrose intravenously",
                        "Increase the 0.9% Normal Saline infusion rate to 500 mL/hr"
                    ],
                    correct: 0,
                    rationale: "When blood glucose reaches 200–250 mg/dL in DKA management, dextrose (D5W or D5 0.45% NS) is added to preventing cerebral edema and hypoglycemia while maintaining insulin to clear ketoacidosis."
                },
                {
                    id: "n11",
                    text: "A 58-year-old male on mechanical ventilation with ARDS exhibits an drop in P/F ratio (PaO2/FiO2) to 92 mmHg despite PEEP of 14 cmH2O and FiO2 of 0.80. Which evidence-based intervention should the lead nurse advocate for next?",
                    options: [
                        "Initiate prone positioning protocol for at least 16 continuous hours daily",
                        "Perform high-volume endotracheal suctioning with normal saline instillation",
                        "Increase tidal volume from 6 mL/kg to 10 mL/kg predicted body weight",
                        "Administer a 500 mL rapid IV crystalloid fluid bolus"
                    ],
                    correct: 0,
                    rationale: "Prone positioning for ≥16 hours per day significantly improves mortality in severe ARDS (P/F ratio < 150) by improving ventilation-perfusion matching and recruitment of posterior lung segments."
                },
                {
                    id: "n12",
                    text: "A patient with septic shock remains hypotensive (MAP 52 mmHg) despite receiving 30 mL/kg of crystalloids. Central venous access is established. Which first-line vasopressor and target MAP should the nurse prepare?",
                    options: [
                        "Norepinephrine titrated to achieve a target MAP ≥ 65 mmHg",
                        "Dopamine infusion titrated to achieve a target MAP ≥ 80 mmHg",
                        "Epinephrine bolus 1 mg IV every 3 minutes to target MAP ≥ 70 mmHg",
                        "Phenylephrine titrated to achieve a target MAP ≥ 60 mmHg"
                    ],
                    correct: 0,
                    rationale: "Surviving Sepsis Campaign guidelines establish Norepinephrine as the first-choice vasopressor with an initial target MAP threshold of ≥ 65 mmHg."
                },
                {
                    id: "n13",
                    text: "An adult patient with T6 spinal cord injury reports a severe, throbbing headache. Blood pressure is 210/110 mmHg, HR is 48 bpm, and diaphoresis is noted above the lesion level. After elevating the head of the bed to 90 degrees, what is the priority nursing action?",
                    options: [
                        "Check the urinary catheter for kinks or blockage, and palpate the bladder",
                        "Administer IV push hydralazine 20 mg immediately",
                        "Perform a digital rectal exam to assess for fecal impaction",
                        "Place the patient in a flat supine position with legs elevated"
                    ],
                    correct: 0,
                    rationale: "Autonomic Dysreflexia is most commonly triggered by bladder distention (kinked catheter, full bladder). Removing the noxious stimulus is the immediate priority after raising the head of the bed."
                },
                {
                    id: "n14",
                    text: "A patient weighing 70 kg suffers 40% Total Body Surface Area (TBSA) partial-thickness and full-thickness burns. According to the Parkland Formula (4 mL × kg × % TBSA), what volume of Lactated Ringer's should be administered during the first 8 hours post-burn?",
                    options: [
                        "5,600 mL",
                        "11,200 mL",
                        "2,800 mL",
                        "7,000 mL"
                    ],
                    correct: 0,
                    rationale: "Total 24-hr fluid = 4 mL × 70 kg × 40 = 11,200 mL. Half of the total volume (5,600 mL) must be infused within the first 8 hours post-injury."
                },
                {
                    id: "n15",
                    text: "A patient receiving continuous IV Sodium Nitroprusside at high doses for malignant hypertension develops confusion, tinnitus, metabolic acidosis, and hyperlactatemia. What antidote combination should the nurse anticipate?",
                    options: [
                        "Sodium Thiosulfate and Sodium Nitrite",
                        "Protamine Sulfate and Vitamin K",
                        "Deferoxamine and Calcium Chloride",
                        "Atropine and Pralidoxime"
                    ],
                    correct: 0,
                    rationale: "Sodium Nitroprusside breakdown releases cyanide ions. Cyanide toxicity presents with metabolic acidosis and neurological changes, treated with Sodium Thiosulfate and Sodium Nitrite (or Hydroxocobalamin)."
                },
                {
                    id: "n16",
                    text: "A patient on heparin therapy for DVT shows a drop in platelet count from 210,000/mm³ to 85,000/mm³ on day 6 of therapy. What is the immediate priority nursing intervention?",
                    options: [
                        "Stop all heparin products immediately and switch to a direct thrombin inhibitor (e.g., Argatroban)",
                        "Request a platelet transfusion to restore normal levels",
                        "Decrease the heparin infusion rate by 50% and recheck platelets in 24 hours",
                        "Switch heparin to Low-Molecular-Weight Heparin (Enoxaparin) subcutaneously"
                    ],
                    correct: 0,
                    rationale: "A >50% drop in platelets after starting heparin indicates Heparin-Induced Thrombocytopenia (HIT). All heparin must be stopped immediately (LMWH is contraindicated due to cross-reactivity) and a non-heparin anticoagulant like Argatroban started."
                },
                {
                    id: "n17",
                    text: "A patient with severe acute pancreatitis exhibits Chvostek's sign, Trousseau's sign, and prolonged QTc interval on ECG. Which electrolyte deficit and immediate replacement protocol are indicated?",
                    options: [
                        "Hypocalcemia; administer IV Calcium Gluconate slowly under cardiac monitoring",
                        "Hypokalemia; administer IV Potassium Chloride rapid push",
                        "Hyponatremia; administer 3% Hypertonic Saline continuous infusion",
                        "Hypomagnesemia; administer oral Magnesium Oxide tablets"
                    ],
                    correct: 0,
                    rationale: "Positive Chvostek's/Trousseau's signs and QTc prolongation signal severe hypocalcemia (common in acute pancreatitis due to fat saponification). IV Calcium Gluconate is administered slowly to prevent arrhythmias."
                },
                {
                    id: "n18",
                    text: "During Central Venous Catheter insertion in the subclavian vein, the patient suddenly develops severe dyspnea, cyanosis, hypotension, and a 'churning' murmur over the precordium. What position should the nurse immediately place the patient in?",
                    options: [
                        "Left lateral Trendelenburg position (Durant's maneuver)",
                        "High Fowler's position with feet dangling",
                        "Right lateral decubitus position with head elevated",
                        "Prone position with neck hyper-extended"
                    ],
                    correct: 0,
                    rationale: "Left lateral Trendelenburg traps air bubbles in the right ventricular apex, preventing air from blocking the pulmonary artery outflow tract in the event of a air embolism."
                },
                {
                    id: "n19",
                    text: "A patient presenting with acute ST-elevation myocardial infarction (STEMI) arrives at a PCI-capable facility. What is the target door-to-balloon time according to current ACC/AHA guidelines?",
                    options: [
                        "Within 90 minutes",
                        "Within 120 minutes",
                        "Within 30 minutes",
                        "Within 180 minutes"
                    ],
                    correct: 0,
                    rationale: "Current ACC/AHA guidelines mandate a door-to-balloon time of ≤ 90 minutes for primary Percutaneous Coronary Intervention (PCI) in PCI-capable centers."
                },
                {
                    id: "n20",
                    text: "An ABG result from a patient with prolonged nasogastric tube suctioning shows: pH 7.52, PaCO2 48 mmHg, HCO3- 36 mEq/L. How should the nurse interpret this acid-base imbalance?",
                    options: [
                        "Partially compensated Metabolic Alkalosis",
                        "Uncompensated Respiratory Alkalosis",
                        "Fully compensated Metabolic Acidosis",
                        "Partially compensated Respiratory Acidosis"
                    ],
                    correct: 0,
                    rationale: "pH > 7.45 (Alkalosis), elevated HCO3- > 26 (Metabolic cause from gastric acid loss), and PaCO2 elevated > 45 (Respiratory compensation attempting to retain CO2)."
                },
                {
                    id: "n21",
                    text: "A patient with traumatic brain injury exhibits a blood pressure shift from 120/80 mmHg to 180/60 mmHg, a heart rate drop from 82 bpm to 44 bpm, and irregular breathing. What clinical phenomenon does this triad represent?",
                    options: [
                        "Cushing's Triad indicating increased Intracranial Pressure (ICP)",
                        "Beck's Triad indicating Cardiac Tamponade",
                        "Virchow's Triad indicating Deep Vein Thrombosis",
                        "Charcot's Triad indicating Acute Cholangitis"
                    ],
                    correct: 0,
                    rationale: "Cushing's Triad (widened pulse pressure/systolic hypertension, bradycardia, and irregular/Cheyne-Stokes respirations) is a late sign of dangerous ICP elevation and impending brain herniation."
                },
                {
                    id: "n22",
                    text: "A patient in cardiac arrest displays Ventricular Fibrillation on the monitor. High-quality CPR is ongoing, and 1 shock has been delivered. What is the next immediate priority intervention?",
                    options: [
                        "Resume high-quality CPR immediately for 2 minutes before re-checking rhythm",
                        "Administer Epinephrine 1 mg IV push immediately",
                        "Deliver a second shock at 360 Joules biphasic",
                        "Endotracheal intubation and check carotid pulse"
                    ],
                    correct: 0,
                    rationale: "ACLS guidelines emphasize resuming chest compressions immediately post-defibrillation for 2 minutes without delaying for pulse checks or medication administration."
                },
                {
                    id: "n23",
                    text: "A patient with acute oliguric renal failure has a serum potassium level of 7.2 mEq/L with ECG showing tall peaked T waves and widened QRS complexes. What medication is administered first to stabilize the cardiac membrane?",
                    options: [
                        "10% IV Calcium Gluconate over 2 to 5 minutes",
                        "Regular Insulin 10 Units IV with 50 mL 50% Dextrose",
                        "Sodium Polystyrene Sulfonate (Kayexalate) orally",
                        "Sodium Bicarbonate 50 mEq IV push"
                    ],
                    correct: 0,
                    rationale: "Calcium Gluconate directly antagonizes the membrane excitability effects of hyperkalemia on cardiac cells, preventing fatal arrhythmias within minutes."
                },
                {
                    id: "n24",
                    text: "A patient receiving a blood transfusion develops acute back pain, fever, chills, hemoglobinuria, and hypotension 15 minutes after initiation. What is the nurse's very first action?",
                    options: [
                        "Stop the blood transfusion immediately and disconnect the tubing at the hub",
                        "Administer IV Diphenhydramine and slow the infusion rate",
                        "Send the patient's urine and remaining blood bag to the lab",
                        "Infuse Normal Saline through the main blood administration set"
                    ],
                    correct: 0,
                    rationale: "An Acute Hemolytic Transfusion Reaction requires immediate cessation of the blood product to limit antigen exposure, preserving IV line access using new tubing."
                },
                {
                    id: "n25",
                    text: "Which ventilator bundle practice is most critical for reducing the incidence of Ventilator-Associated Pneumonia (VAP) in an ICU setting?",
                    options: [
                        "Elevating the head of the bed between 30 and 45 degrees unless contraindicated",
                        "Instilling normal saline routinely prior to endotracheal suctioning",
                        "Changing ventilator circuits every 24 hours routinely",
                        "Maintaining deep sedation continuously with Propofol infusion"
                    ],
                    correct: 0,
                    rationale: "Elevating the head of the bed to 30–45 degrees significantly decreases aspiration of gastric and oropharyngeal secretions, serving as a core component of VAP bundles."
                },
                {
                    id: "n26",
                    text: "A patient in anaphylactic shock receives IM Epinephrine 0.3 mg (1:1000). BP remains 76/40 mmHg after 5 minutes. What is the correct next step in pharmacological management?",
                    options: [
                        "Repeat IM Epinephrine 0.3 mg into the anterolateral thigh every 5–15 minutes if response is inadequate",
                        "Switch to IV Methylprednisolone 125 mg push immediately",
                        "Administer Oral Cetirizine 10 mg",
                        "Infuse IV Dopamine at 2 mcg/kg/min"
                    ],
                    correct: 0,
                    rationale: "First-line management of refractory anaphylaxis involves repeating intramuscular epinephrine into the mid-outer thigh every 5 to 15 minutes as needed."
                },
                {
                    id: "n27",
                    text: "A patient on continuous telemetry develops sustained Monomorphic Ventricular Tachycardia. The patient is conscious, coherent, and reports mild lightheadedness with BP 118/74 mmHg. What intervention is indicated?",
                    options: [
                        "Administer IV Amiodarone 150 mg over 10 minutes",
                        "Perform immediate Synchronized Cardioversion at 100 Joules",
                        "Perform immediate Unsynchronized Defibrillation at 200 Joules",
                        "Deliver a Precordial Thump and begin CPR"
                    ],
                    correct: 0,
                    rationale: "Stable monomorphic VT with pulses is treated pharmacologically with antiarrhythmic infusions (Amiodarone or Procainamide). Synchronized cardioversion is reserved for unstable VT."
                },
                {
                    id: "n28",
                    text: "An adult trauma victim exhibits muffled heart sounds, jugular venous distention (JVD), and a drop in systolic BP during inspiration > 10 mmHg (pulsus paradoxus). Which diagnostic condition is present?",
                    options: [
                        "Cardiac Tamponade",
                        "Tension Pneumothorax",
                        "Flail Chest",
                        "Pulmonary Embolism"
                    ],
                    correct: 0,
                    rationale: "Beck's Triad (muffled heart sounds, JVD, hypotension) alongside pulsus paradoxus is classic for cardiac tamponade, requiring emergency pericardiocentesis."
                },
                {
                    id: "n29",
                    text: "A patient with persistent status epilepticus has received 2 IV doses of Lorazepam without seizure cessation. Which second-line IV antiepileptic drug should the nurse prepare?",
                    options: [
                        "IV Fosphenytoin or Levetiracetam",
                        "IV Propofol bolus 2 mg/kg",
                        "IV Ketamine continuous drip",
                        "Oral Carbamazepine via NG tube"
                    ],
                    correct: 0,
                    rationale: "When benzodiazepines fail to terminate status epilepticus, second-line IV antiepileptic agents such as Fosphenytoin, Valproate, or Levetiracetam are indicated."
                },
                {
                    id: "n30",
                    text: "A post-operative thyroidectomy patient complains of tingling around the mouth and fingers with muscle cramping. On tapping the facial nerve, the facial muscles twitch. What is this sign and underlying cause?",
                    options: [
                        "Chvostek's sign caused by accidental surgical removal or damage to the parathyroid glands leading to Hypocalcemia",
                        "Trousseau's sign caused by surgical thyroid storm leading to Hypercalcemia",
                        "Kernig's sign caused by postoperative bacterial meningitis",
                        "Trousseau's sign caused by recurrent laryngeal nerve damage"
                    ],
                    correct: 0,
                    rationale: "Tapping the facial nerve (Chvostek's sign) causing facial twitching indicates acute hypocalcemia resulting from inadvertent parathyroid resection during thyroidectomy."
                },
                {
                    id: "n31",
                    text: "An ICU patient receiving total parenteral nutrition (TPN) via a central line suddenly runs out of TPN solution before the new bag arrives from the pharmacy. What IV fluid should be hung immediately to prevent rebound hypoglycemia?",
                    options: [
                        "10% Dextrose in Water (D10W) at the same infusion rate",
                        "0.9% Normal Saline at a KVO rate",
                        "Lactated Ringer's solution bolus",
                        "5% Dextrose in 0.45% Normal Saline at twice the rate"
                    ],
                    correct: 0,
                    rationale: "Abrupt cessation of high-concentration glucose TPN causes hyperinsulinemia-induced rebound hypoglycemia. D10W should be infused at the same rate until the new TPN bag is available."
                },
                {
                    id: "n32",
                    text: "A patient with a pulmonary artery catheter has a pulmonary capillary wedge pressure (PCWP) of 22 mmHg (normal 6-12) and Cardiac Index (CI) of 1.7 L/min/m² (normal 2.5-4.0). Which hemodynamic profile does this reflect?",
                    options: [
                        "Cardiogenic Shock",
                        "Hypovolemic Shock",
                        "Distributive (Septic) Shock",
                        "Obstructive Shock"
                    ],
                    correct: 0,
                    rationale: "Elevated PCWP (> 18 mmHg) indicating left ventricular volume overload paired with a low Cardiac Index (< 2.2 L/min/m²) defines Cardiogenic Shock."
                },
                {
                    id: "n33",
                    text: "A patient experiencing malignant hyperthermia during surgery requires immediate pharmacotherapy. What is the specific mechanism of action of Dantrolene Sodium in this emergency?",
                    options: [
                        "Binds to ryanodine receptors to inhibit calcium release from the sarcoplasmic reticulum in muscle cells",
                        "Blocks neuromuscular transmission by competing with acetylcholine at the motor end-plate",
                        "Inhibits central catecholamine release from adrenergic nerve terminals",
                        "Directly stimulates peripheral vascular alpha-1 adrenergic receptors"
                    ],
                    correct: 0,
                    rationale: "Dantrolene acts directly on muscle cells by binding to the RYR1 ryanodine receptor, blocking the excessive intracellular calcium release that drives hypermetabolism in Malignant Hyperthermia."
                },
                {
                    id: "n34",
                    text: "A patient admitted with acute ischemic stroke is evaluated for recombinant tissue plasminogen activator (rtPA). Symptoms started 2 hours ago. Which finding is an absolute contraindication to IV fibrinolytic therapy?",
                    options: [
                        "Non-contrast CT head demonstrating acute intracranial hemorrhage",
                        "Blood pressure of 165/95 mmHg on arrival",
                        "Age of 72 years with controlled Type 2 Diabetes",
                        "Platelet count of 180,000/mm³"
                    ],
                    correct: 0,
                    rationale: "Evidence of intracranial hemorrhage on initial non-contrast head CT is an absolute contraindication to thrombolytic therapy due to severe risk of fatal bleeding."
                },
                {
                    id: "n35",
                    text: "A patient receiving Digoxin 0.25 mg daily reports visual halo changes (yellow-green vision), nausea, and dizziness. ECG shows frequent unifocal PVCs. Digoxin level is 3.1 ng/mL. What reversal agent should be prepared?",
                    options: [
                        "Digoxin Immune Fab (Digibind / Digifab)",
                        "Atropine Sulfate IV",
                        "Naloxone Hydrochloride IV",
                        "Physostigmine Salicylate IV"
                    ],
                    correct: 0,
                    rationale: "Digoxin levels > 2.0 ng/mL accompanied by visual disturbances, GI distress, and ventricular ectopy confirm digoxin toxicity, treated specifically with Digoxin Immune Fab."
                },

        // Exam State
        let currentTrack = 'nurse';
        let currentMode = 'practice';
        let currentIndex = 0;
        let userAnswers = {};
        let flaggedQuestions = {};
        let timerInterval;
        let timeLeft = 0;

        function initApp() {
            startExam();
        }

        function loadTrack() {
            currentTrack = document.getElementById('trackSelect').value;
            startExam();
        }

        function startExam() {
            currentMode = document.getElementById('modeSelect').value;
            currentIndex = 0;
            userAnswers = {};
            flaggedQuestions = {};

            const questions = questionBank[currentTrack] || [];
            if (questions.length === 0) {
                alert("No questions available for this track.");
                return;
            }

            document.getElementById('examArea').style.display = 'grid';
            document.getElementById('resultsArea').style.display = 'none';

            if (currentMode === 'exam') {
                timeLeft = questions.length * 90;
                document.getElementById('timerBox').style.display = 'block';
                startTimer();
            } else {
                document.getElementById('timerBox').style.display = 'none';
                clearInterval(timerInterval);
            }

            renderQuestion();
            renderPalette();
        }

        function renderQuestion() {
            const questions = questionBank[currentTrack];
            const q = questions[currentIndex];

            document.getElementById('qIndex').innerText = `Question ${currentIndex + 1} of ${questions.length}`;
            document.getElementById('qText').innerText = q.text;

            const optionsBox = document.getElementById('optionsBox');
            optionsBox.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (userAnswers[currentIndex] === idx) btn.classList.add('selected');

                if (currentMode === 'practice' && userAnswers[currentIndex] !== undefined) {
                    if (idx === q.correct) btn.classList.add('correct');
                    if (userAnswers[currentIndex] === idx && idx !== q.correct) btn.classList.add('incorrect');
                }

                btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
                btn.onclick = () => selectOption(idx);
                optionsBox.appendChild(btn);
            });

            const rationaleBox = document.getElementById('rationaleBox');
            if (currentMode === 'practice' && userAnswers[currentIndex] !== undefined) {
                rationaleBox.style.display = 'block';
                document.getElementById('rationaleText').innerText = q.rationale;
            } else {
                rationaleBox.style.display = 'none';
            }

            document.getElementById('flagBtn').style.borderColor = flaggedQuestions[currentIndex] ? 'var(--warning)' : 'var(--border)';
        }

        function selectOption(idx) {
            userAnswers[currentIndex] = idx;
            renderQuestion();
            renderPalette();
        }

        function toggleFlag() {
            flaggedQuestions[currentIndex] = !flaggedQuestions[currentIndex];
            renderQuestion();
            renderPalette();
        }

        function nextQuestion() {
            const questions = questionBank[currentTrack];
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
                renderPalette();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
                renderPalette();
            }
        }

        function renderPalette() {
            const grid = document.getElementById('gridPalette');
            grid.innerHTML = '';
            const questions = questionBank[currentTrack];

            questions.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.className = 'palette-btn';
                if (userAnswers[idx] !== undefined) btn.classList.add('answered');
                if (flaggedQuestions[idx]) btn.classList.add('flagged');
                if (idx === currentIndex) btn.classList.add('active');

                btn.innerText = idx + 1;
                btn.onclick = () => { currentIndex = idx; renderQuestion(); renderPalette(); };
                grid.appendChild(btn);
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishExam();
                } else {
                    timeLeft--;
                    const m = Math.floor(timeLeft / 60);
                    const s = timeLeft % 60;
                    document.getElementById('timerBox').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                }
            }, 1000);
        }

        function finishExam() {
            clearInterval(timerInterval);
            document.getElementById('examArea').style.display = 'none';
            document.getElementById('resultsArea').style.display = 'block';

            const questions = questionBank[currentTrack];
            let correctCount = 0;
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.correct) correctCount++;
            });

            const percentage = ((correctCount / questions.length) * 100).toFixed(1);
            document.getElementById('scoreText').innerText = 
                `Score: ${correctCount} / ${questions.length} (${percentage}%) - ${percentage >= 75 ? 'PASS' : 'FAIL'}`;
        }

        function resetExam() {
            startExam();
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }

        window.onload = initApp;
    </script>
